name: Build and deploy ASP.NET Core app to Azure Web App - cinema-bv

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/main_cinema-bv.yml'
      - 'KinoKlik/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'NuGet.config'
  workflow_dispatch:

concurrency:
  group: cinema-bv-deploy
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: KinoKlik/KinoKlik.sln
  WEB_PROJECT_PATH: KinoKlik/Web/KinoKlik.Web.csproj
  AZURE_WEBAPP_NAME: cinema-bv
  ARTIFACT_NAME: dotnet-app

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_PATH }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_PATH }}" --configuration Release --no-restore

      - name: Test
        run: dotnet test "${{ env.SOLUTION_PATH }}" --configuration Release --no-build

      - name: Publish
        run: dotnet publish "${{ env.WEB_PROJECT_PATH }}" --configuration Release --no-build --output "${{ runner.temp }}/publish"

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishPath = "${{ runner.temp }}/publish"

          if (-not (Test-Path (Join-Path $publishPath "KinoKlik.Web.dll"))) {
            throw "Publish output is missing KinoKlik.Web.dll."
          }

          if (-not (Test-Path (Join-Path $publishPath "web.config"))) {
            throw "Publish output is missing web.config."
          }

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}/publish
          if-no-files-found: error
          retention-days: 7

  deploy:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: app
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_818DC83B21024F5C8EAFD8B94881BFBD }}

      - name: Health check
        shell: pwsh
        run: |
          $baseUrl = "${{ steps.deploy-to-webapp.outputs.webapp-url }}".Trim()

          if ([string]::IsNullOrWhiteSpace($baseUrl)) {
            throw "Azure deploy action did not return a webapp-url output."
          }

          if ($baseUrl -notmatch "^https?://") {
            $baseUrl = "https://$baseUrl"
          }

          $healthUrl = $baseUrl.TrimEnd("/") + "/health"

          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Write-Host "Health check attempt $attempt for $healthUrl"
              Invoke-RestMethod -Uri $healthUrl -Method Get -TimeoutSec 30
              exit 0
            }
            catch {
              if ($attempt -eq 12) {
                throw
              }

              Start-Sleep -Seconds 10
            }
          }
